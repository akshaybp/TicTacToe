<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tic Tac Toe Game</title>
</head>
<body>
    <div class="container">
        <h1 class="game-title">Tic Tac Toe</h1>

        <div id="lobby-screen">
            <div class="form-group">
                <label for="display-name">Your name</label>
                <input type="text" id="display-name" maxlength="20" placeholder="Enter your name">
            </div>

            <div class="lobby-actions">
                <button id="create-room-btn">Create Room</button>

                <div class="join-row">
                    <input type="text" id="join-code-input" maxlength="4" placeholder="Room code" autocapitalize="characters">
                    <button id="join-room-btn">Join Room</button>
                </div>
            </div>

            <div class="error-message" id="lobby-error"></div>
        </div>

        <div id="room-screen" class="hidden">
            <div class="room-info">
                <div class="room-code-display">
                    Room: <span id="room-code-text"></span>
                    <button id="copy-link-btn" title="Copy invite link">Copy Link</button>
                </div>
                <div class="players-row">
                    <div class="player-badge">
                        <span class="mark">X</span>
                        <span class="name" id="player-x-name">Waiting…</span>
                        <span class="dot" id="player-x-dot"></span>
                    </div>
                    <div class="player-badge">
                        <span class="mark">O</span>
                        <span class="name" id="player-o-name">Waiting…</span>
                        <span class="dot" id="player-o-dot"></span>
                    </div>
                </div>
                <div class="status-line" id="status-line"></div>
            </div>

            <div id="game-board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="game-result" id="game-result"></div>

            <div class="button-container">
                <button id="rematch-btn" class="hidden">Rematch</button>
                <button id="leave-room-btn">Leave Room</button>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
